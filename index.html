<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14342B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Mon budget</title>
<style>
:root{--bg:#EEF1EC;--card:#fff;--ink:#14261F;--mut:#66766D;--pine:#14342B;--in:#2F7D5B;--out:#8E3B5A;--warn:#D9A21B;--line:#DCE3DD;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0E1814;--card:#172520;--ink:#E8EFEA;--mut:#93A39A;--pine:#0A1C16;--in:#5CC49A;--out:#E58BAB;--line:#2A3B33}}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
main{padding:0 16px}
.hero{background:var(--pine);color:#F2F6F3;padding:18px 16px 20px;border-radius:0 0 24px 24px}
.mn{display:flex;align-items:center;justify-content:space-between;font-weight:600}
.mn button{background:none;border:0;color:inherit;font-size:22px;padding:4px 12px}
.big{font:600 44px/1.1 Georgia,"Times New Roman",serif;margin:14px 0 4px;letter-spacing:-.5px}
.sub{opacity:.75;font-size:14px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--in);border-radius:4px}
.two{display:flex;justify-content:space-between;font-size:14px}
h2{font:600 17px Georgia,serif;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.al{border-left:4px solid var(--warn);font-size:14px}.al.r{border-color:var(--out)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.pb{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--in)}.pb i.w{background:var(--warn)}.pb i.r{background:var(--out)}
.m{color:var(--mut);font-size:13px}.in{color:var(--in)}.out{color:var(--out)}
.tx b{font-weight:600}
.x{background:none;border:0;color:var(--mut);font-size:18px;padding:2px 6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);max-width:560px;margin:auto}
nav button{flex:1;background:none;border:0;padding:14px 0;color:var(--mut);font:600 14px inherit}
nav button.on{color:var(--in);box-shadow:inset 0 3px 0 var(--in)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;border:0;background:var(--pine);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.btn{width:100%;padding:12px;border-radius:12px;border:1px dashed var(--mut);background:none;color:var(--ink);font:inherit}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,400px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 10px;font:600 19px Georgia,serif}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px inherit}
dialog .row button{flex:1;padding:12px;border-radius:12px;border:0;background:var(--pine);color:#fff;font:600 15px inherit}
dialog .row .g{background:var(--line);color:var(--ink)}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
</style></head><body>
<div id="app"></div>
<button class="fab" aria-label="Ajouter une opération" onclick="addTx()">+</button>
<nav><button data-t="home">Accueil</button><button data-t="rec">Récurrents</button><button data-t="sav">Épargne</button></nav>
<dialog id="dl"></dialog>
<script>
const $=s=>document.querySelector(s),K='budget.v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{tx:[],rec:[],bud:{},goals:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const CO={Logement:'🏠',Courses:'🛒',Transport:'🚌',Loisirs:'🎬',Santé:'💊',Abonnements:'📺',Autres:'🧾'};
const ALL=[...Object.keys(CO),'Salaire'];
const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');
const mk=d=>d.slice(0,7);
const sum=(l,t,c)=>l.filter(x=>x.t==t&&(!c||x.c==c)).reduce((s,x)=>s+x.a,0);
let M=mk(today()),tab='home';
const shift=(m,n)=>{const d=new Date(+m.slice(0,4),+m.slice(5)-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const lab=(m,o)=>new Date(m+'-01').toLocaleDateString('fr-FR',o||{month:'long',year:'numeric'});
function gen(){const t=today(),m=mk(t);S.rec.forEach(r=>{if(r.last!==m&&+t.slice(8)>=r.day){S.tx.push({id:uid(),d:m+'-'+String(r.day).padStart(2,'0'),t:r.t,c:r.c,a:r.a,n:r.n});r.last=m}});save()}
function ask(title,fs,cb){const d=$('#dl');
d.innerHTML=`<h3>${title}</h3>`+fs.map((f,i)=>`<label>${f.l}`+(f.o?`<select id="f${i}">${f.o.map(o=>`<option ${o==f.v?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="f${i}" type="${f.t||'text'}" ${f.t=='number'?'step="0.01" inputmode="decimal"':''} value="${esc(f.v??'')}">`)+`</label>`).join('')+`<div class="row"><button class="g" onclick="dl.close()">Annuler</button><button onclick="ok()">Enregistrer</button></div>`;
window.ok=()=>{const v=fs.map((f,i)=>$('#f'+i).value);if(cb(v)!==false){dl.close();save();render()}};d.showModal()}
function addTx(){ask('Nouvelle opération',[{l:'Type',o:['Dépense','Revenu']},{l:'Montant (€)',t:'number'},{l:'Catégorie',o:ALL},{l:'Date',t:'date',v:today()},{l:'Note',v:''}],
v=>{const a=parseFloat(v[1]);if(!(a>0))return false;S.tx.push({id:uid(),t:v[0]=='Revenu'?'in':'out',a,c:v[2],d:v[3]||today(),n:v[4]});M=mk(v[3]||today())})}
function setBud(c){ask('Budget mensuel : '+c,[{l:'Plafond (€), 0 pour retirer',t:'number',v:S.bud[c]||''}],v=>{const a=parseFloat(v[0])||0;if(a>0)S.bud[c]=a;else delete S.bud[c]})}
function addRec(){ask('Opération récurrente',[{l:'Type',o:['Dépense','Revenu']},{l:'Libellé (loyer, abonnement…)'},{l:'Montant (€)',t:'number'},{l:'Catégorie',o:ALL},{l:'Jour du mois (1-28)',t:'number',v:1}],
v=>{const a=parseFloat(v[2]),day=Math.min(28,Math.max(1,parseInt(v[4])||1));if(!(a>0)||!v[1])return false;S.rec.push({id:uid(),t:v[0]=='Revenu'?'in':'out',n:v[1],a,c:v[3],day});gen()})}
function addGoal(){ask('Objectif d\'épargne',[{l:'Nom'},{l:'Montant visé (€)',t:'number'},{l:'Déjà épargné (€)',t:'number',v:0}],v=>{const g=parseFloat(v[1]);if(!v[0]||!(g>0))return false;S.goals.push({id:uid(),n:v[0],g,s:parseFloat(v[2])||0})})}
function fund(id){const g=S.goals.find(x=>x.id==id);ask('Ajouter à « '+esc(g.n)+' »',[{l:'Montant (€), négatif pour retirer',t:'number'}],v=>{const a=parseFloat(v[0]);if(!a)return false;g.s=Math.max(0,g.s+a)})}
const del=(k,id)=>{if(confirm('Supprimer ?')){S[k]=S[k].filter(x=>x.id!=id);save();render()}};
function chart(){const ms=[5,4,3,2,1,0].map(n=>shift(M,-n)),d=ms.map(m=>{const l=S.tx.filter(x=>mk(x.d)==m);return[m,sum(l,'in'),sum(l,'out')]}),mx=Math.max(1,...d.flatMap(x=>[x[1],x[2]]));
return`<svg viewBox="0 0 300 120" width="100%" role="img" aria-label="Revenus et dépenses sur 6 mois">`+d.map((x,i)=>{const h1=x[1]/mx*85,h2=x[2]/mx*85,X=i*50+6;return`<rect x="${X}" y="${95-h1}" width="16" height="${h1}" rx="3" fill="var(--in)"/><rect x="${X+18}" y="${95-h2}" width="16" height="${h2}" rx="3" fill="var(--out)"/><text x="${X+17}" y="112" font-size="10" text-anchor="middle" fill="var(--mut)">${lab(x[0],{month:'short'})}</text>`}).join('')+`</svg><div class="m"><span class="in">■</span> Revenus &nbsp;<span class="out">■</span> Dépenses</div>`}
function home(){const tx=S.tx.filter(x=>mk(x.d)==M).sort((a,b)=>b.d.localeCompare(a.d)),I=sum(tx,'in'),O=sum(tx,'out'),p=I?Math.min(100,O/I*100):(O?100:0);
const cats=Object.keys(CO).map(c=>({c,s:sum(tx,'out',c),b:S.bud[c]||0}));
const al=cats.filter(x=>x.b&&x.s>=x.b*.8).map(x=>`<div class="card al ${x.s>=x.b?'r':''}"><b>${x.c}</b> : ${Math.round(x.s/x.b*100)} % du budget ${x.s>=x.b?'dépassé de '+eur(x.s-x.b):'atteint'}</div>`).join('');
return`<div class="hero"><div class="mn"><button aria-label="Mois précédent" onclick="M=shift(M,-1);render()">‹</button><span>${lab(M)}</span><button aria-label="Mois suivant" onclick="M=shift(M,1);render()">›</button></div>
<div class="big">${eur(I-O)}</div><div class="sub">Solde du mois</div><div class="bar"><i style="width:${p}%;background:${O>I?'var(--out)':'var(--in)'}"></i></div>
<div class="two"><span>Revenus ${eur(I)}</span><span>Dépenses ${eur(O)}</span></div></div><main>${al?'<h2>Alertes</h2>'+al:''}
<h2>Six derniers mois</h2><div class="card">${chart()}</div>
<h2>Budgets par catégorie</h2>${cats.map(x=>{const r=x.b?x.s/x.b:0;return`<div class="card" onclick="setBud('${x.c}')"><div class="row"><span>${CO[x.c]} ${x.c}</span><span class="m">${eur(x.s)}${x.b?' / '+eur(x.b):' · toucher pour fixer un budget'}</span></div>${x.b?`<div class="pb"><i class="${r>=1?'r':r>=.8?'w':''}" style="width:${Math.min(100,r*100)}%"></i></div>`:''}</div>`}).join('')}
<h2>Opérations</h2>${tx.length?tx.map(x=>`<div class="card tx row"><div><b>${CO[x.c]||'💼'} ${x.c}</b><div class="m">${x.d.slice(8)}/${x.d.slice(5,7)} ${esc(x.n||'')}</div></div><div><span class="${x.t}">${x.t=='in'?'+':'−'}${eur(x.a)}</span><button class="x" aria-label="Supprimer" onclick="del('tx','${x.id}')">✕</button></div></div>`).join(''):'<div class="card m">Aucune opération ce mois-ci. Touche + pour en ajouter une.</div>'}</main>`}
function rec(){return`<main><h2>Opérations récurrentes</h2><p class="m">Ajoutées automatiquement chaque mois au jour choisi.</p>${S.rec.map(r=>`<div class="card row"><div><b>${esc(r.n)}</b><div class="m">${r.c} · le ${r.day} de chaque mois</div></div><div><span class="${r.t}">${r.t=='in'?'+':'−'}${eur(r.a)}</span><button class="x" aria-label="Supprimer" onclick="del('rec','${r.id}')">✕</button></div></div>`).join('')}<button class="btn" onclick="addRec()">+ Ajouter une récurrence</button></main>`}
function sav(){return`<main><h2>Objectifs d'épargne</h2>${S.goals.map(g=>{const p=Math.min(100,g.s/g.g*100);return`<div class="card"><div class="row"><b>${esc(g.n)}</b><button class="x" aria-label="Supprimer" onclick="del('goals','${g.id}')">✕</button></div><div class="m">${eur(g.s)} sur ${eur(g.g)} · ${Math.round(p)} %${g.s<g.g?' · reste '+eur(g.g-g.s):' · atteint 🎉'}</div><div class="pb"><i style="width:${p}%"></i></div><button class="btn" style="margin-top:10px" onclick="fund('${g.id}')">Verser ou retirer</button></div>`}).join('')}<button class="btn" onclick="addGoal()">+ Nouvel objectif</button></main>`}
function render(){$('#app').innerHTML={home,rec,sav}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('.fab').style.display=tab=='home'?'':'none'}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
gen();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
